# vHost-Vorlage für SymfoLeave (nginx + PHP-FPM)
# Platzhalter: __PHP_FPM_SOCKET__ (z. B. /run/php/php8.3-fpm.sock)
# SSL-Block wird von server-setup.sh bzw. certbot ergänzt.

server {
    listen 80;
    listen [::]:80;
    server_name symfoleave.jeremythelen.de;

    root /var/www/symfoleave.jeremythelen.de/public;
    index index.php;

    access_log /var/log/nginx/symfoleave.jeremythelen.de.access.log;
    error_log  /var/log/nginx/symfoleave.jeremythelen.de.error.log;

    # Versteckte Dateien (.env, .git, …) sperren – außer ACME-Challenge
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:__PHP_FPM_SOCKET__;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Andere PHP-Dateien niemals ausführen
    location ~ \.php$ {
        return 404;
    }

    location ~* ^/assets/.+\.(css|js|svg|png|jpg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
