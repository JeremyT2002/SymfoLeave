# vHost für SymfoLeave mit Apache + mod_php (so läuft PHP auf jeremythelen.de).
# Installieren: cp nach /etc/apache2/sites-available/symfoleave.jeremythelen.de.conf,
#               a2ensite symfoleave.jeremythelen.de && apache2ctl configtest && systemctl reload apache2
# SSL danach:   certbot --apache -d symfoleave.jeremythelen.de --non-interactive --agree-tos --redirect
# Variante mit PHP-FPM: deploy/apache.conf
<VirtualHost *:80>
        ServerName symfoleave.jeremythelen.de
        DocumentRoot /var/www/symfoleave.jeremythelen.de/public

        <Directory /var/www/symfoleave.jeremythelen.de/public/>
            Options -Indexes +FollowSymLinks -MultiViews
            AllowOverride None
            Require all granted
            FallbackResource /index.php
        </Directory>

        # Versteckte Dateien (.env, .git …) sperren – außer ACME-Challenge für Let's Encrypt
        <LocationMatch "/\.(?!well-known)">
            Require all denied
        </LocationMatch>

        <IfModule mod_headers.c>
            <Directory /var/www/symfoleave.jeremythelen.de/public/assets/>
                Header set Cache-Control "public, max-age=31536000, immutable"
            </Directory>
        </IfModule>

        php_admin_value open_basedir "/var/www/symfoleave.jeremythelen.de/:/tmp/:/usr/share/php/"
        ErrorLog ${APACHE_LOG_DIR}/symfoleave-error.log
        CustomLog ${APACHE_LOG_DIR}/symfoleave-access.log combined
</VirtualHost>
