# vHost-Vorlage für SymfoLeave (Apache + PHP-FPM via mod_proxy_fcgi)
# Platzhalter: __PHP_FPM_SOCKET__ (z. B. /run/php/php8.3-fpm.sock)
# Benötigt: a2enmod rewrite proxy_fcgi setenvif

<VirtualHost *:80>
    ServerName symfoleave.jeremythelen.de
    DocumentRoot /var/www/symfoleave.jeremythelen.de/public

    ErrorLog ${APACHE_LOG_DIR}/symfoleave.jeremythelen.de.error.log
    CustomLog ${APACHE_LOG_DIR}/symfoleave.jeremythelen.de.access.log combined

    <Directory /var/www/symfoleave.jeremythelen.de/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    # Versteckte Dateien (.env, .git, …) sperren – außer ACME-Challenge
    <LocationMatch "/\.(?!well-known)">
        Require all denied
    </LocationMatch>

    <FilesMatch "^index\.php$">
        SetHandler "proxy:unix:__PHP_FPM_SOCKET__|fcgi://localhost"
    </FilesMatch>

    <IfModule mod_headers.c>
        <Directory /var/www/symfoleave.jeremythelen.de/public/assets>
            Header set Cache-Control "public, max-age=31536000, immutable"
        </Directory>
    </IfModule>
</VirtualHost>
